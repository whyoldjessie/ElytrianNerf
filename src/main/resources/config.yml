# Глобальные уведомления в чате (вкл/выкл все сообщения плагина сразу)
chat-notifications: true

# Чинит креативный полёт: у Элитриана в креативе двойной прыжок включал элитры Origins,
# а не обычный полёт. true: в креативе работает обычный креативный полёт.
creative-flight-fix: true

# ------------------------------------------------------------------------
# 1. НАСТРОЙКА УДАРОВ И КУЛДАУНА АКТИВАЦИИ ЭЛИТР
# ------------------------------------------------------------------------
hit:
  # Кто может сбить элитры ударом: player (только игроки), all_mobs (все), only_mobs ( только мобы без игроков)
  target: "player"
  # Сколько секунд после удара элитры заблокированы
  block-seconds: 10
  # Считать только удар голой рукой (в руке ничего нет)
  only-bare-hand: false
  # Прерывать ли уже идущий полет при ударе
  stop-gliding-on-hit: true
  # Применять ли этот дебафф, если надеты настоящие элитры
  real-elytra-debuff: false

# ------------------------------------------------------------------------
# 2. МЕХАНИКА ВОДЫ
# ------------------------------------------------------------------------
water:
  enabled: true
  # Сколько секунд после выхода из воды полёт недоступен
  block-seconds: 2
  # Применять ли этот дебафф, если надеты настоящие элитры
  real-elytra-debuff: false

# ------------------------------------------------------------------------
# 3. СИСТЕМА «ТОПЛИВА» (РАСХОД СЫТОСТИ В ПОЛЕТЕ)
# ------------------------------------------------------------------------
fuel:
  enabled: true
  # Интервал в тиках (20 тиков = 1 сек), с которым списывается сытость/выдается эффект
  interval-ticks: 20
  # Количество единиц сытости, отнимаемое за раз
  depletion: 1
  # Выдавать ли эффект «Голод» (HUNGER) во время полета
  give-hunger-effect: true
  amplifier: 0
  duration-ticks: 40
  # Применять ли топливо/голод, если надеты настоящие элитры
  real-elytra-debuff: false

# ------------------------------------------------------------------------
# 4. КОМПЕНСАЦИЯ БРОНИ ДЛЯ НАСТОЯЩИХ ЭЛИТР
# ------------------------------------------------------------------------
real-elytra-armor:
  enabled: true
  # Давать ли эффект железного нагрудника (Armor: 6), если надеты настоящие элитры
  give-iron-armor-stats: true

# ------------------------------------------------------------------------
# СООБЩЕНИЯ В ЧАТЕ (%seconds% — оставшееся время)
# ------------------------------------------------------------------------
messages:
  in-water: "&cВ воде элитры недоступны!"
  recently-hit: "&cЭлитры заблокированы ещё на %seconds% сек. после удара!"
